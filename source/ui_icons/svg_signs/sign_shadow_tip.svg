<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660">
  <!-- 第3幕 案内板 「影を重ねる」(継ぎ目13 / R3 影の間)
       ★5 枚の中でこれが一番大事。実機で「影の意味が分からない・バグだと思った」と
         言われた部屋。【あの黒い板は自分の影だ】を、絵だけで言い切る必要がある。
       ★仕掛け: 影は【立っている人とまったく同じ 6 本の図形】を、足元(380,566)を軸に
         倒して潰しただけ(下の transform)。描き直していないので、頭・胴・広げた腕・
         開いた脚が 1 対 1 で対応する。別の物には見えようが無い。
         輪郭がにじまないよう、群ごと不透明度を下げている(重なりで濃くならない)。
       そのうえで 3 つを 1 本の線で繋ぐ:
         灯り → (点線の光線が人の頭のど真ん中を貫く) → 影の頭
         影の長さを決めているのは灯りと自分の体だ、と線 1 本で言う。
       床の輪郭は実機と同じ【ただの四角い擦れ跡】。光らせない・金にしない。
         金にすると「探すべき金の四角」を探して見つからなくなる。
       ★どこに立つかは描かない。影の先が輪郭に入る、という関係だけを描く。
       ★目(照準)は描かない。この部屋だけは見る向きが一切関係無いから。 -->
  <rect width="1000" height="660" fill="#E4DFCD"/>
  <rect x="16" y="16" width="968" height="628" fill="none"
        stroke="#2B2924" stroke-width="6" stroke-opacity="0.45"/>

  <!-- 灯り → 人の頭 → 影の頭。人と影より先に描くので、体のところは隠れる -->
  <path d="M 210 132 L 803 566" fill="none" stroke="#2B2924" stroke-width="6"
        stroke-opacity="0.5" stroke-dasharray="22 16" stroke-linecap="round"/>

  <!-- 床 -->
  <path d="M 76 566 L 930 566" stroke="#2B2924" stroke-width="10" stroke-opacity="0.5"
        stroke-linecap="round"/>

  <!-- 自分の影 = 下の人とまったく同じ図形を、足元で倒して潰したもの -->
  <g opacity="0.42">
    <g transform="translate(380,566) rotate(90) scale(0.75,1.42) translate(-380,-566)"
       fill="none" stroke="#2B2924" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 380 310 L 380 448" stroke-width="54"/>
      <path d="M 380 342 L 312 434" stroke-width="32"/>
      <path d="M 380 342 L 448 434" stroke-width="32"/>
      <path d="M 380 448 L 346 566" stroke-width="38"/>
      <path d="M 380 448 L 414 566" stroke-width="38"/>
      <circle cx="380" cy="268" r="48" fill="#2B2924" stroke="none"/>
    </g>
  </g>

  <!-- 床の輪郭(的)。実機と同じ、ただ床に描いてある細い四角。影の上にも残る -->
  <polygon points="740,520 894,520 916,612 716,612" fill="none"
           stroke="#2B2924" stroke-width="8" stroke-opacity="0.6" stroke-linejoin="round"/>

  <!-- 吊り下がった灯り 1 つ(この部屋の光は本当にこれ 1 つだけ) -->
  <path d="M 210 40 L 210 68" stroke="#2B2924" stroke-width="10" stroke-linecap="round"/>
  <polygon points="170,110 250,110 236,68 184,68" fill="#2B2924"/>
  <circle cx="210" cy="122" r="13" fill="#2B2924"/>
  <g stroke="#2B2924" stroke-width="7" stroke-opacity="0.55" stroke-linecap="round">
    <path d="M 166 140 L 142 166"/>
    <path d="M 210 152 L 210 184"/>
    <path d="M 254 140 L 278 166"/>
  </g>

  <!-- 立っている人。上の影とまったく同じ 6 本の図形 -->
  <g stroke="#2B2924" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 380 310 L 380 448" stroke-width="42"/>
    <path d="M 380 342 L 312 434" stroke-width="24"/>
    <path d="M 380 342 L 448 434" stroke-width="24"/>
    <path d="M 380 448 L 346 566" stroke-width="28"/>
    <path d="M 380 448 L 414 566" stroke-width="28"/>
  </g>
  <circle cx="380" cy="268" r="42" fill="#2B2924"/>
</svg>
