<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660">
  <!-- 第1幕 案内板 1/3 「歩く / 見る」
       押す物は無い。歩いて、視野に入れる。それだけ、を絵で言う。
       ★文字・数字・記号文字は一切使わない。 -->
  <rect width="1000" height="660" fill="#E4DFCD"/>
  <rect x="16" y="16" width="968" height="628" fill="none"
        stroke="#2B2924" stroke-width="6" stroke-opacity="0.45"/>

  <!-- 視野の扇(=見ている範囲)。頭を頂点にして前方へ開く -->
  <polygon points="286,168 930,60 930,300" fill="#2B2924" fill-opacity="0.09"/>
  <polyline points="930,60 286,168 930,300" fill="none" stroke="#2B2924" stroke-width="6"
            stroke-opacity="0.55" stroke-dasharray="26 18" stroke-linecap="round"/>

  <!-- 目(=見る) -->
  <path d="M 630 168 Q 706 78 782 168 Q 706 258 630 168 Z"
        fill="none" stroke="#2B2924" stroke-width="11" stroke-linejoin="round"/>
  <circle cx="706" cy="168" r="22" fill="#2B2924"/>

  <!-- 歩く人 -->
  <g stroke="#2B2924" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 232 216 L 224 372" stroke-width="42"/>
    <path d="M 224 372 L 172 452 L 146 548" stroke-width="34"/>
    <path d="M 224 372 L 296 444 L 318 548" stroke-width="34"/>
    <path d="M 230 258 L 168 330" stroke-width="26"/>
    <path d="M 230 258 L 300 318" stroke-width="26"/>
  </g>
  <circle cx="232" cy="168" r="48" fill="#2B2924"/>

  <!-- 床と、前へ進むことを示す矢羽根 -->
  <path d="M 80 566 L 856 566" stroke="#2B2924" stroke-width="12" stroke-linecap="round"/>
  <polygon points="852,528 940,566 852,604" fill="#2B2924"/>
</svg>
